{% extends 'base.html' %}

{% block content %}
<div class="container mt-4" style="max-width: 500px;">
    <h2>Criar Conta</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" name="first_name" class="form-control" value="{{ first_name|default:'' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Usuário</label>
            <input type="text" name="username" class="form-control" value="{{ username|default:'' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" name="email" class="form-control" value="{{ email|default:'' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Telefone</label>
            <input type="text" name="telefone" class="form-control" value="{{ telefone|default:'' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" name="senha" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Confirme a senha</label>
            <input type="password" name="senha_confirmacao" class="form-control" required>
        </div>
        <button class="btn btn-primary">Cadastrar</button>
    </form>

    <p class="mt-3">
        Já tem conta? <a href="{% url 'login' %}">Entrar</a>
    </p>
</div>
{% endblock %}
