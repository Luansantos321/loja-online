{% extends 'painel/base.html' %}

{% block conteudo %}
<div class="container mt-4">
    <h2>Nova Variação — {{ produto.nome }}</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="row">
            <div class="col-md-12 mb-3">
                <label class="form-label">Foto da variação</label>
                <input type="file" class="form-control" name="imagem" accept="image/*">
            </div>

            <div class="col-md-3 mb-3">
                <label class="form-label">Tamanho</label>
                <input type="text" class="form-control" name="tamanho" placeholder="Ex: P, M, G">
            </div>

            <div class="col-md-3 mb-3">
                <label class="form-label">Cor</label>
                <input type="text" class="form-control" name="cor" placeholder="Ex: Azul">
            </div>

            <div class="col-md-3 mb-3">
                <label class="form-label">SKU</label>
                <input type="text" class="form-control" name="sku">
            </div>

            <div class="col-md-3 mb-3">
                <label class="form-label">Preço</label>
                <input type="text" class="form-control" name="preco" placeholder="Ex: 59,90" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Quantidade inicial em estoque</label>
            <input type="number" class="form-control" name="quantidade_inicial" min="0" value="0">
        </div>

        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="{% url 'painel_produto_detalhe' produto.id %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
